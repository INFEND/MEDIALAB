name: MediaLAB · Signed Android OTA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'native/**'
      - 'release_notes/**'
      - '.github/workflows/ota-release.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: medialab-official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Check out complete MediaLAB sources
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Download and verify FFmpegKit Full 8.1.9 to app/libs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --output app/libs/ffmpeg-kit-full-8.1.9.aar \
            'https://github.com/ffmpegkit-maintained/ffmpeg/releases/download/v8.1.9-lts-android/ffmpeg-kit-full-8.1.9-arm64-v8a-x86_64.aar'
          echo '40b52770a339af3bf8c02d8a9808c89b5f0e0e56eca39c10dc76c01b90f32306  app/libs/ffmpeg-kit-full-8.1.9.aar' | sha256sum --check --status
          test "$(stat -c%s app/libs/ffmpeg-kit-full-8.1.9.aar)" -eq 31057330
          echo 'Verified input; Java bridge only will be included in APK.'

      - name: Regression test central video sample with copied audio
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi
          python3 scripts/test_video_sample.py
          python3 scripts/test_asc_full.py
          bash scripts/test_resumable_modules.sh
          javac -d /tmp/medialab-photo-preview-test app/src/main/java/com/xarkon/medialab/PhotoPreviewPlan.java scripts/TestPhotoPreviewPlan.java
          java -cp /tmp/medialab-photo-preview-test com.xarkon.medialab.TestPhotoPreviewPlan

      - name: Build standalone PHOTO ULTRA and PHOTO EXTRA runtimes
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install 'ndk;27.2.12479018'
          bash scripts/build_photo_ultra.sh
          bash scripts/build_photo_extra.sh
          bash scripts/build_video_ultra.sh
          bash scripts/build_avif_ultra.sh

      - name: Compile Android release
        shell: bash
        run: |
          if ! gradle --no-daemon --stacktrace :app:assembleRelease; then
            echo 'Retrying with refreshed Gradle dependencies'
            gradle --no-daemon --refresh-dependencies --stacktrace :app:assembleRelease
          fi

      - name: Verify lightweight APK and external ARM64 pack
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          python3 scripts/verify_engine_pack.py "$APK" .gradle/medialab-engine-8.1.9/ffmpeg-arm64-8.1.9.zip

      - name: Sign with the permanent identity from GitHub Secret
        env:
          MEDIALAB_SIGNING_BUNDLE: ${{ secrets.MEDIALAB_SIGNING_BUNDLE || secrets.MEDIA_LAB_SIGNING_BUNDLE || secrets.MEDIALAB_RELEASE_SIGNING_BUNDLE || secrets.ANDROID_SIGNING_BUNDLE || secrets.SIGNING_BUNDLE || secrets.MEDIALAB_SIGNING }}
          MEDIA_LAB_SIGNING_BUNDLE: ${{ secrets.MEDIA_LAB_SIGNING_BUNDLE }}
        run: python3 scripts/sign_release.py

      - name: Generate update.json from the signed APK
        id: metadata
        run: python3 scripts/make_manifest.py

      - name: Verify signed light APK and stage standalone library
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_engine_pack.py dist/MediaLAB.apk .gradle/medialab-engine-8.1.9/ffmpeg-arm64-8.1.9.zip
          if [ "${{ steps.metadata.outputs.tag }}" = v1.3.27 ]; then
            cp .gradle/medialab-engine-8.1.9/ffmpeg-arm64-8.1.9.zip dist/
          fi
          python3 -m json.tool dist/update.json >/dev/null
          python3 scripts/verify_photo_ultra.py dist/MediaLAB.apk .gradle/medialab-photo-ultra/photo-ultra-arm64-v1.so
          python3 scripts/verify_photo_extra.py dist/MediaLAB.apk .gradle/medialab-photo-extra/photo-extra-arm64-v1.so
          python3 scripts/verify_video_ultra.py dist/MediaLAB.apk .gradle/medialab-video-ultra/video-ultra-arm64-v1.so
          python3 scripts/verify_avif_ultra.py dist/MediaLAB.apk .gradle/medialab-avif-ultra/avif-ultra-arm64-v1.so
          if [ -f .gradle/medialab-video-ultra/publish-with-current ]; then
            cp .gradle/medialab-video-ultra/video-ultra-arm64-v1.so dist/
            cp .gradle/medialab-video-ultra/video-ultra-source-relink.tar.gz dist/
          fi
          if [ -f .gradle/medialab-photo-ultra/publish-with-current ]; then
            cp .gradle/medialab-photo-ultra/photo-ultra-arm64-v1.so dist/
            cp .gradle/medialab-photo-ultra/photo-ultra-licenses.txt dist/
          fi
          if [ -f .gradle/medialab-photo-extra/publish-with-current ]; then
            cp .gradle/medialab-photo-extra/photo-extra-arm64-v1.so dist/
            cp .gradle/medialab-photo-extra/photo-extra-licenses.txt dist/
            cp .gradle/medialab-photo-extra/photo-extra-Cargo.lock dist/
          fi
          if [ -f .gradle/medialab-avif-ultra/publish-with-current ]; then
            cp .gradle/medialab-avif-ultra/avif-ultra-arm64-v1.so dist/
            cp .gradle/medialab-avif-ultra/avif-ultra-licenses.txt dist/
          fi

      - name: Retain signed build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLAB-official-APK-and-OTA
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; increment versionCode and versionName for the next OTA."
            exit 1
          fi
          ASSETS=(dist/MediaLAB.apk dist/update.json)
          if [ "$TAG" = v1.3.27 ]; then
            ASSETS+=(dist/ffmpeg-arm64-8.1.9.zip)
          else
            gh release view v1.3.27 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq 'ffmpeg-arm64-8.1.9.zip'
          fi
          if [ -f dist/photo-ultra-arm64-v1.so ]; then
            ASSETS+=(dist/photo-ultra-arm64-v1.so dist/photo-ultra-licenses.txt)
          fi
          if [ -f dist/photo-extra-arm64-v1.so ]; then
            ASSETS+=(dist/photo-extra-arm64-v1.so dist/photo-extra-licenses.txt dist/photo-extra-Cargo.lock)
          fi
          if [ -f dist/video-ultra-arm64-v1.so ]; then
            ASSETS+=(dist/video-ultra-arm64-v1.so dist/video-ultra-source-relink.tar.gz)
          fi
          if [ -f dist/avif-ultra-arm64-v1.so ]; then
            ASSETS+=(dist/avif-ultra-arm64-v1.so dist/avif-ultra-licenses.txt)
          fi
          gh release create "$TAG" "${ASSETS[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MediaLAB $VERSION" --notes-file "release_notes/$TAG.txt" --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq 'MediaLAB.apk'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq 'update.json'
          echo "Verified release APK and manifest: $TAG"
