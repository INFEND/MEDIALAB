name: MediaLAB · Signed Android OTA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'scripts/**'
      - 'release_notes/**'
      - '.github/workflows/ota-release.yml'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'

permissions:
  contents: write

concurrency:
  group: medialab-official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out complete MediaLAB sources
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Android platform and build tools
        run: sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 9.6.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.1'

      - name: Download and verify FFmpegKit Full 8.1.9 to app/libs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/libs
          curl --fail --location --retry 4 --retry-delay 3 --connect-timeout 20 \
            --output app/libs/ffmpeg-kit-full-8.1.9.aar \
            'https://github.com/ffmpegkit-maintained/ffmpeg/releases/download/v8.1.9-lts-android/ffmpeg-kit-full-8.1.9-arm64-v8a-x86_64.aar'
          echo '40b52770a339af3bf8c02d8a9808c89b5f0e0e56eca39c10dc76c01b90f32306  app/libs/ffmpeg-kit-full-8.1.9.aar' | sha256sum --check --status
          test "$(stat -c%s app/libs/ffmpeg-kit-full-8.1.9.aar)" -eq 31057330
          echo 'Verified FFmpegKit native libraries will be packaged inside the APK.'

      - name: Compile Android release
        run: gradle --no-daemon --stacktrace :app:assembleRelease

      - name: Confirm native FFmpeg binaries are inside the compiled APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          test -n "$APK"
          unzip -l "$APK" | grep -Eq 'lib/arm64-v8a/lib(ffmpegkit|avcodec|avformat)[^/]*\.so' \
            || { echo '::error::Native FFmpeg libraries missing from compiled APK'; exit 1; }

      - name: Sign with the permanent identity from GitHub Secret
        env:
          MEDIALAB_SIGNING_BUNDLE: ${{ secrets.MEDIALAB_SIGNING_BUNDLE || secrets.MEDIA_LAB_SIGNING_BUNDLE || secrets.MEDIALAB_RELEASE_SIGNING_BUNDLE || secrets.ANDROID_SIGNING_BUNDLE || secrets.SIGNING_BUNDLE || secrets.MEDIALAB_SIGNING }}
          MEDIA_LAB_SIGNING_BUNDLE: ${{ secrets.MEDIA_LAB_SIGNING_BUNDLE }}
        run: python3 scripts/sign_release.py

      - name: Generate update.json from the signed APK
        id: metadata
        run: python3 scripts/make_manifest.py

      - name: Verify embedded FFmpeg ARM64 libraries
        shell: bash
        run: |
          set -euo pipefail
          unzip -l dist/MediaLAB.apk | grep -Eq 'lib/arm64-v8a/lib(ffmpegkit|avcodec|avformat)[^/]*\.so' \
            || { echo '::error::FFmpeg ARM64 native libraries missing from APK'; exit 1; }
          python3 -m json.tool dist/update.json >/dev/null

      - name: Retain signed build as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MediaLAB-official-APK-and-OTA
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.metadata.outputs.tag }}
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release $TAG exists; increment versionCode and versionName for the next OTA."
            exit 1
          fi
          gh release create "$TAG" dist/MediaLAB.apk dist/update.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "MediaLAB $VERSION" --notes-file "release_notes/$TAG.txt" --latest
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq 'MediaLAB.apk'
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" \
            --json assets --jq '.assets[].name' | grep -Fxq 'update.json'
          echo "Verified release APK and manifest: $TAG"
