plugins {
    id 'com.android.application'
}

// Generate a Java-only AAR and external ARM64 pack from pinned app/libs input.
apply from: 'ffmpeg-pack.gradle'
def engineAar = project.ext.medialabEngineAar
def engineAssets = project.ext.medialabEngineAssets

android {
    namespace 'com.xarkon.medialab'
    compileSdk 35
    buildFeatures { buildConfig true }

    defaultConfig {
        applicationId 'com.xarkon.medialab'
        minSdk 29
        targetSdk 35
        versionCode 57
        versionName '1.3.35'
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    sourceSets {
        main {
            java.srcDir 'src/local_ffmpeg_compat/java'
            assets.srcDir engineAssets
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}

dependencies {
    implementation files(engineAar)
}

logger.lifecycle('MediaLAB 1.3.35: light APK with separate FFmpeg runtime')
